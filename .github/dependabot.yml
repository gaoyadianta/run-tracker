version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-build:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
